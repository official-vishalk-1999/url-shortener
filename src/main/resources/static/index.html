<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:480px;margin-top:80px;">
  <div class="card p-4 shadow-sm">
    <h4 class="mb-3">URL Shortener</h4>
    <input id="url" class="form-control mb-2" placeholder="Paste a long URL">
    <button class="btn btn-primary w-100" onclick="shorten()">Shorten</button>
    <p id="out" class="mt-3 mb-0"></p>
  </div>
</div>
<script>
async function shorten() {
  const url = document.getElementById("url").value;
  const res = await fetch("/shorten", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
  const link = location.origin + "/" + (await res.json()).shortCode;
  document.getElementById("out").innerHTML =
    'Short URL: <a href="' + link + '" target="_blank">' + link + '</a>';
}
</script>
</body>
</html>
